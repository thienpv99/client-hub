<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>CSS audit · Client Hub</title>
    <style>
      body { font: 14px/1.5 ui-monospace, Consolas, monospace; margin: 24px; color: #0F172A; background: #F6F8FC; }
      button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 0; background: #1D4ED8; color: #fff; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: progress; }
      a { color: #1D4ED8; margin-left: 12px; }
      pre { white-space: pre-wrap; background: #fff; border: 1px solid #E5E9F0; border-radius: 12px; padding: 16px; }
      #stage { display: flex; gap: 12px; align-items: flex-start; margin: 12px 0; }
      .frame-box { position: relative; overflow: hidden; border: 1px solid #E5E9F0; border-radius: 12px; background: #fff; flex: none; }
      .frame-box iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; }
      #status { font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Kiểm tra độ phủ CSS biên dịch sẵn (bản 1 file)</h1>
    <p id="desc"></p>
    <p><button id="run">Chạy kiểm tra</button><a id="quick" href="?quick=1&amp;auto=1">nhanh (1440, không AM)</a><a id="cmp" href="?compare=ClientHub-demo-runtime.html&amp;roles=client_member&amp;overlays=0&amp;auto=1">so computed style với bản Tailwind runtime</a><a id="cmpdev" href="?compare=dev&amp;roles=client_member&amp;overlays=0&amp;auto=1">so với ứng dụng dev</a></p>
    <p id="status"></p>
    <div id="stage"></div>
    <pre id="log"></pre>
    <script type="module">
      // Proves that the CSS precompiled by tools/build-standalone.html covers every class the app really renders.
      //
      // 1. Opens dist/<file> (default ClientHub-demo.html) in a same-origin iframe, signs in through the demo cards like
      //    a user (director, AM, member, both client roles), walks a broad route list at 1440×900 and 390×844, opens the
      //    overlays it can reach (every [aria-haspopup] trigger, comboboxes, the Ctrl+K palette, task drawers via ?task=)
      //    and records every class token that ever appears in the DOM (MutationObserver, old values included).
      // 2. Recompiles those DOM tokens with the same Tailwind engine, config and app CSS as the build (read from the
      //    build's sidecar dist/<name>.tailwind-inputs.json, else from the live sources): that is exactly the CSS the
      //    dev app (Tailwind Play in the page) would generate for those screens.
      // 3. Real misses = DOM tokens the engine makes CSS for that the inlined stylesheet has no selector for (selectors
      //    walked recursively through @media / @supports, unescaped). Rule parity = every reference rule present verbatim
      //    in the inlined sheet, in the same cascade order. Both must be empty.
      //    Tokens with no CSS anywhere (also not in dev) are listed by kind, never counted: Tailwind markers (group,
      //    peer, group/name, peer/name: they only style through a group-*/peer-* variant on another element), classes
      //    set by libraries (recharts-*, lucide*, sonner — not in our sources) and the app's own hook classes.
      // 4. Also checks the file itself: no Tailwind runtime, no style[type=text/tailwindcss], no external resource
      //    reference in the markup or the CSS; records any request the page made to another host while it ran.
      // 5. Conflicts: no element may carry two utilities of the same kind (same variant context, same property set) that
      //    set a property to different values (text-caption + text-primary, px-4 + px-5…) — the winner would depend on
      //    rule order, which the dev runtime and the build need not share (DESIGN §7.1). Must be empty too.
      // ?compare=<other>.html additionally loads a second build side by side on a route subset and compares the computed
      // style of every element — normally ClientHub-demo-runtime.html, which build-standalone.html?auto=1&twin=1 writes
      // from the same sources with the Tailwind runtime in the page (the previous output) — or ?compare=dev: the no-build
      // dev app itself (nobuild.html + sw.js, Tailwind Play from its CDN; needs network). Differences are split into
      // stylesheet ones (must be 0) and layout / JS-measured ones (auto margins, sizes, inline styles written from a
      // measurement), which depend on timing. Results: window.__CSS_AUDIT__ (progress: window.__CSS_AUDIT_PROGRESS__).
      // Params: ?auto=1 · ?file= · ?widths=1440,390 · ?roles=director,am,member,client_owner,client_member · ?overlays=0 ·
      // ?quick=1 (1440 only, no AM) · ?compare=<file>|dev. The audit signs in (demo cards) and reads the shared mock db only
      // to pick ids; the tab's session and the remembered-device session are restored at the end.
      import {
        TAILWIND_LOCAL, compileTailwind, configScriptFrom, extractCandidates, flattenRules, inputsFileName,
        parseCss, ruleClassNames, selectorClassNames, stripTailwindDirectives,
      } from '/tools/tailwind-precompile.js';

      const params = new URLSearchParams(location.search);
      const QUICK = params.has('quick');
      const FILE = params.get('file') || 'ClientHub-demo.html';
      const COMPARE = params.get('compare');
      const NAME_OK = /^[A-Za-z0-9._-]+\.html$/;
      const WIDTHS = (params.get('widths') || (QUICK ? '1440' : '1440,390')).split(',').map(Number).filter((n) => n >= 320 && n <= 2560);
      const ROLES = (params.get('roles') || (QUICK ? 'director,member,client_owner,client_member' : 'director,am,member,client_owner,client_member'))
        .split(',').filter(Boolean);
      const OVERLAYS = params.get('overlays') !== '0';
      const ACCOUNT = params.get('account') || 'acc_coxanh';
      const SESSION_KEY = 'clienthub.session.v1';
      const DB_KEY = 'clienthub.db.v1';
      const heightOf = (w) => (w >= 768 ? 900 : 844);

      // DOM classes that have no CSS by design (also none in the dev app): reported by kind, never counted as misses.
      const MARKER = /^(group|peer)(\/[\w-]+)?$/; // Tailwind markers: `.group:hover .group-hover\:x` styles the CHILD
      // set by recharts / lucide-react / sonner; any other class missing from our sources (e.g. Google Sign-In's) counts too
      const LIBRARY = /^(recharts-|lucide$|lucide-|sonner|toaster$|toast$)/;

      const logEl = document.getElementById('log');
      const statusEl = document.getElementById('status');
      const log = (m) => { logEl.textContent += m + '\n'; };
      const status = (m) => { statusEl.textContent = m; window.__CSS_AUDIT_PROGRESS__ = m; };
      const kb = (n) => (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
      const utf8Bytes = (s) => new TextEncoder().encode(s).length;

      document.getElementById('desc').textContent = 'Mở dist/' + FILE + ' trong iframe, đăng nhập bằng thẻ demo, đi qua các màn ('
        + ROLES.join(', ') + ' · ' + WIDTHS.map((w) => w + '×' + heightOf(w)).join(', ') + '), ghi mọi lớp CSS xuất hiện trong DOM rồi đối chiếu với CSS nhúng trong file.'
        + (COMPARE ? ' So computed style với ' + (COMPARE === 'dev' ? 'ứng dụng dev' : 'dist/' + COMPARE) + '.' : '');

      // ---------- timing that keeps working in a background tab ----------
      // Hidden tabs clamp setTimeout to 1 s and, after 5 min, chained timers to 1 per minute; posted messages are not
      // throttled, so waits poll through a MessageChannel.
      const chan = new MessageChannel();
      const waiting = [];
      chan.port1.onmessage = () => { const r = waiting.shift(); if (r) r(); };
      const yieldTask = () => new Promise((r) => { waiting.push(r); chan.port2.postMessage(0); });
      async function sleep(ms) {
        const end = performance.now() + ms;
        while (performance.now() < end) await yieldTask();
      }
      async function waitFor(fn, timeout, message) {
        const end = performance.now() + timeout;
        for (;;) {
          let v;
          try { v = fn(); } catch { v = null; }
          if (v) return v;
          if (performance.now() > end) throw new Error(message || 'Hết thời gian chờ');
          await sleep(40);
        }
      }

      // ---------- frames ----------
      // Motion is switched off inside the audited page: Radix keeps a closing overlay mounted until its exit animation
      // ends, and a hidden tab never ends an animation. Class attributes do not depend on it.
      const NO_MOTION = '*,*::before,*::after{animation:none!important;transition:none!important}';
      let loads = 0;

      function makeFrame(label) {
        const box = document.createElement('div');
        box.className = 'frame-box';
        const el = document.createElement('iframe');
        el.title = label;
        box.append(el);
        document.getElementById('stage').append(box);
        const f = { el, box, lastMutation: performance.now(), observer: null, onClass: null, errors: [], requests: [] };
        return f;
      }
      function sizeFrame(f, w) {
        const h = heightOf(w);
        const scale = Math.min(1, (COMPARE ? 520 : 760) / w);
        f.el.width = String(w);
        f.el.height = String(h);
        f.el.style.width = w + 'px';
        f.el.style.height = h + 'px';
        f.el.style.transform = 'scale(' + scale + ')';
        f.box.style.width = Math.round(w * scale) + 'px';
        f.box.style.height = Math.round(h * scale) + 'px';
      }
      const docOf = (f) => f.el.contentDocument;
      const winOf = (f) => f.el.contentWindow;

      function harvestRequests(f) {
        try {
          for (const e of winOf(f).performance.getEntriesByType('resource')) {
            if (!/^https?:/i.test(e.name)) continue;
            const u = new URL(e.name);
            if (u.origin !== location.origin) f.requests.push(u.origin + u.pathname);
          }
        } catch { /* document gone */ }
      }

      function attach(f) {
        const doc = docOf(f);
        const win = winOf(f);
        if (f.observer) f.observer.disconnect();
        const add = (v) => {
          if (!v) return;
          if (f.onClass) for (const tok of v.split(/\s+/)) if (tok) f.onClass(tok);
          if (f.onList) f.onList(v); // whole class lists: same-kind conflicts on one element
        };
        const scan = (node) => {
          if (node.nodeType !== 1) return;
          add(node.getAttribute('class'));
          for (const el of node.querySelectorAll('[class]')) add(el.getAttribute('class'));
        };
        f.observer = new MutationObserver((records) => {
          f.lastMutation = performance.now();
          for (const r of records) {
            if (r.type === 'attributes') { add(r.oldValue); add(r.target.getAttribute('class')); }
            else for (const n of r.addedNodes) scan(n);
          }
        });
        f.observer.observe(doc.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['class'], attributeOldValue: true });
        scan(doc.documentElement);
        win.addEventListener('error', (e) => f.errors.push(String(e.message || e.error)));
        win.addEventListener('unhandledrejection', (e) => f.errors.push(String(e.reason && e.reason.message ? e.reason.message : e.reason)));
        const style = doc.createElement('style');
        style.id = 'ch-audit-no-motion';
        style.textContent = NO_MOTION;
        doc.head.append(style);
      }

      async function blank(f) {
        harvestRequests(f);
        if (f.observer) f.observer.disconnect();
        let loaded = false;
        f.el.addEventListener('load', () => { loaded = true; }, { once: true });
        f.el.src = 'about:blank';
        await waitFor(() => loaded, 10000, 'Khung không về trang trắng được.');
      }

      // A frame shows a built file (HashRouter: `/dist/<file>#/path`) or, with target 'dev', the no-build dev app
      // (nobuild.html + sw.js, Tailwind Play from its CDN, BrowserRouter: `/path`).
      const labelOf = (target) => (target === 'dev' ? 'ứng dụng dev' : 'dist/' + target);
      function currentPath(f) {
        const loc = winOf(f).location;
        return f.target === 'dev' ? loc.pathname + loc.search : loc.hash.slice(1);
      }
      function go(f, path) {
        const w = winOf(f);
        if (f.target === 'dev') {
          w.history.pushState(null, '', path);
          w.dispatchEvent(new w.PopStateEvent('popstate', { state: null }));
        } else {
          w.location.hash = '#' + path;
        }
      }

      async function load(f, target, path) {
        harvestRequests(f);
        loads += 1;
        f.target = target;
        let loaded = false;
        f.el.addEventListener('load', () => { loaded = true; }, { once: true });
        // a built file is one URL whatever the hash: the query makes every load a real reload
        f.el.src = target === 'dev' ? path : '/dist/' + target + '?audit=' + loads + '#' + path;
        const what = labelOf(target);
        await waitFor(() => loaded, 60000, what + ' không tải xong sau 60 s.');
        attach(f);
        let doc = docOf(f);
        const bootError = () => {
          const box = doc.getElementById('boot-error');
          return box && box.textContent.trim() ? new Error(what + ' báo lỗi khởi động: ' + box.textContent.trim().slice(0, 400)) : null;
        };
        let fatal = null;
        await waitFor(() => {
          if (docOf(f) !== doc) { attach(f); doc = docOf(f); } // the dev page reloads once while its service worker takes over
          fatal = bootError();
          return fatal || (!doc.getElementById('boot') && doc.getElementById('root') && doc.getElementById('root').childElementCount > 0);
        }, 90000, what + ' không khởi động sau 90 s.');
        if (fatal) throw fatal;
      }

      /** quiet: no DOM mutation for `quiet` ms in any frame and no skeleton on screen; false after `max` */
      async function settle(frames, { quiet = 400, max = 9000 } = {}) {
        const t0 = performance.now();
        await sleep(120);
        while (performance.now() - t0 < max) {
          const now = performance.now();
          const calm = frames.every((f) => {
            const d = docOf(f);
            return d && !d.querySelector('.skeleton, .skeleton-reveal, #boot') && now - f.lastMutation >= quiet;
          });
          if (calm) return true;
          await sleep(60);
        }
        return false;
      }

      // ---------- user actions ----------
      function press(el) {
        const W = el.ownerDocument.defaultView;
        const base = { bubbles: true, cancelable: true, composed: true, view: W, button: 0, buttons: 1, clientX: 2, clientY: 2 };
        const ptr = { pointerId: 1, pointerType: 'mouse', isPrimary: true };
        el.dispatchEvent(new W.PointerEvent('pointerdown', { ...base, ...ptr }));
        el.dispatchEvent(new W.MouseEvent('mousedown', base));
        el.dispatchEvent(new W.PointerEvent('pointerup', { ...base, ...ptr, buttons: 0 }));
        el.dispatchEvent(new W.MouseEvent('mouseup', { ...base, buttons: 0 }));
        el.dispatchEvent(new W.MouseEvent('click', { ...base, buttons: 0 }));
      }
      function key(f, init) {
        const doc = docOf(f);
        const W = winOf(f);
        const target = doc.activeElement || doc.body;
        target.dispatchEvent(new W.KeyboardEvent('keydown', { bubbles: true, cancelable: true, ...init }));
        target.dispatchEvent(new W.KeyboardEvent('keyup', { bubbles: true, cancelable: true, ...init }));
      }
      const escape = (f) => key(f, { key: 'Escape', code: 'Escape' });
      function typeInto(input, value) {
        const W = input.ownerDocument.defaultView;
        Object.getOwnPropertyDescriptor(W.HTMLInputElement.prototype, 'value').set.call(input, value);
        input.dispatchEvent(new W.Event('input', { bubbles: true }));
      }

      const CARD = {
        director: (t) => t.includes('Giám đốc'),
        am: (t) => t.includes('Quản lý khách hàng'),
        client_owner: (t) => t.includes('Người quyết định'),
        client_member: (t) => t.includes('Khách hàng') && t.includes('Thành viên') && !t.includes('nội bộ'),
        member: (t) => t.includes('Thành viên nội bộ'),
      };
      const CARD_ORDER = ['director', 'am', 'client_owner', 'client_member']; // DemoLoginPanel MAIN_ROLES (fallback)
      function demoButton(doc, role) {
        const panel = doc.querySelector('section[aria-labelledby="demo-login-title"]');
        if (!panel) return null;
        const buttons = [...panel.querySelectorAll('button')];
        const hit = buttons.find((b) => CARD[role] && CARD[role](b.textContent.replace(/\s+/g, ' ')));
        if (hit) return hit;
        const cards = [...panel.querySelectorAll('ul button')];
        const i = CARD_ORDER.indexOf(role);
        return i >= 0 && cards.length === CARD_ORDER.length ? cards[i] : null;
      }

      function clearSession() {
        try { sessionStorage.removeItem(SESSION_KEY); } catch { /* ignore */ }
        try { localStorage.removeItem(SESSION_KEY); } catch { /* ignore */ }
      }

      /** fresh load of /login in frames[0], click the role's demo card; other frames (same tab session) reload after it */
      async function signIn(frames, file, role) {
        // a signed-in page still running in a frame may write its session back: unload every frame before clearing
        for (const g of frames) await blank(g);
        clearSession();
        const f = frames[0];
        await load(f, file, '/login');
        await settle([f]);
        const btn = await waitFor(() => demoButton(docOf(f), role), 20000, 'Không thấy thẻ đăng nhập demo cho vai trò ' + role + '.');
        btn.click();
        await waitFor(() => /^\/(app|portal)/.test(currentPath(f)), 20000, 'Bấm thẻ demo ' + role + ' nhưng không vào được app.');
        for (const g of frames.slice(1)) await load(g, COMPARE, currentPath(f));
      }

      // ---------- ids from the shared mock db (read only) ----------
      function pickIds() {
        let db = null;
        try { db = JSON.parse(localStorage.getItem(DB_KEY) || 'null'); } catch { db = null; }
        const live = (rows) => (Array.isArray(rows) ? rows.filter((r) => r && !r.deleted_at) : []);
        const projects = new Set(live(db && db.projects).filter((p) => p.account_id === ACCOUNT).map((p) => p.id));
        const tasks = live(db && db.tasks).filter((t) => projects.has(t.project_id));
        const open = (t) => t.status !== 'done';
        const clientTask = tasks.find((t) => t.side === 'client' && open(t)) || tasks.find((t) => t.side === 'client');
        const internalTask = tasks.find((t) => t.side === 'internal' && open(t)) || tasks[0];
        const am = live(db && db.users).find((u) => u.email === 'ha.nguyen@newera.inc');
        const opps = live(db && db.opportunities);
        const opp = opps.find((o) => am && o.owner_id === am.id) || opps[0];
        const leads = live(db && db.leads).filter((l) => l.status !== 'converted');
        const lead = leads.find((l) => !l.owner_id || (am && l.owner_id === am.id)) || leads[0];
        const quotes = live(db && db.quotes).filter((q) => q.account_id === ACCOUNT);
        const quote = quotes[0] || live(db && db.quotes)[0];
        const portalQuote = quotes.find((q) => ['sent', 'accepted', 'changes_requested', 'expired'].includes(q.status));
        const id = (r) => (r ? r.id : null);
        return { db: !!db, clientTask: id(clientTask), internalTask: id(internalTask), opp: id(opp), lead: id(lead), quote: id(quote), portalQuote: id(portalQuote) };
      }

      function routesFor(role, ids) {
        const acc = '/app/accounts/' + ACCOUNT;
        const opt = (id, path) => (id ? [path] : []);
        const tabs = (base, list) => list.map((x) => base + '/' + x);
        if (role === 'director' || role === 'am') {
          return [
            '/app', '/app/accounts',
            ...tabs(acc, ['overview', 'tasks', 'roadmap', 'sales', 'commercial', 'documents', 'contacts', 'activity']),
            ...opt(ids.internalTask, acc + '/tasks?task=' + ids.internalTask),
            '/app/tasks', '/app/tasks?mine=1', ...opt(ids.clientTask, '/app/tasks?task=' + ids.clientTask),
            '/app/crm', ...tabs('/app/crm', ['pipeline', 'list', 'forecast', 'followups']), ...opt(ids.opp, '/app/crm/opportunities/' + ids.opp),
            '/app/targets', ...tabs('/app/targets', ['leads', 'segments', 'accounts', 'icp']), ...opt(ids.lead, '/app/targets/leads/' + ids.lead),
            '/app/projects', ...tabs('/app/projects', ['portfolio', 'timeline', 'workload']),
            '/app/map',
            '/app/commercial', ...tabs('/app/commercial', ['quotes', 'contracts', 'receivables', 'prices']), ...opt(ids.quote, '/app/commercial/quotes/' + ids.quote),
            '/app/notifications', '/app/digest',
            '/app/settings', ...tabs('/app/settings', ['users', 'invites', 'templates', 'pricing', 'rules']),
            '/app/accounts/new',
            '/app/khong-co-trang-nay',
          ];
        }
        if (role === 'member') {
          return [
            '/app', '/app/tasks', ...opt(ids.internalTask, '/app/tasks?task=' + ids.internalTask),
            ...tabs('/app/projects', ['portfolio', 'timeline', 'workload']),
            '/app/accounts', ...tabs(acc, ['overview', 'tasks', 'roadmap', 'documents', 'contacts', 'activity']),
            '/app/notifications', '/app/digest', '/app/map',
          ];
        }
        if (role === 'client_owner') {
          return [
            '/portal', '/portal/tasks', ...opt(ids.clientTask, '/portal/tasks/' + ids.clientTask), '/portal/progress',
            '/portal/commercial', ...opt(ids.portalQuote, '/portal/commercial/quotes/' + ids.portalQuote),
            '/portal/documents', '/portal/settings', '/portal/khong-co-trang-nay',
          ];
        }
        return ['/portal', '/portal/tasks', '/portal/progress', '/portal/documents', '/portal/settings'];
      }

      // ---------- the static file ----------
      function fileChecks(html) {
        const styles = [...html.matchAll(/<style\b([^>]*)>([\s\S]*?)<\/style>/gi)];
        const tw = styles.find((m) => /\bid=["']?ch-tailwind\b/.test(m[1]));
        const markup = html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, '<script><\/script>'); // script bodies are code
        const staticRefs = [];
        for (const m of markup.matchAll(/<(script|link|img|iframe|source|video|audio|embed|object)\b[^>]*\b(src|href|data)\s*=\s*["']?(?:https?:)?\/\/[^"'\s>]+/gi)) staticRefs.push(m[0].slice(0, 200));
        for (const m of styles) {
          for (const u of m[2].matchAll(/url\(\s*['"]?((?:https?:)?\/\/[^'")\s]+)/gi)) staticRefs.push('url(' + u[1] + ')');
          if (/@import\b/i.test(m[2].replace(/\/\*[\s\S]*?\*\//g, ''))) staticRefs.push('@import trong <style>');
        }
        const hosts = {};
        for (const m of html.matchAll(/https?:\/\/([a-z0-9.-]+\.[a-z]{2,})/gi)) hosts[m[1].toLowerCase()] = (hosts[m[1].toLowerCase()] || 0) + 1;
        return {
          tailwindRuntime: html.includes('should not be used in production'),
          tailwindStyleTag: /<style[^>]*\btype\s*=\s*["']?text\/tailwindcss/i.test(html),
          tailwindConfig: /window\.tailwind\.config\s*=/.test(html),
          css: tw ? tw[2] : null,
          staticRefs,
          hostsMentioned: hosts,
        };
      }

      async function readInputs(htmlBytes) {
        const sidecar = inputsFileName(FILE);
        try {
          const res = await fetch('/dist/' + sidecar, { cache: 'no-store' });
          if (res.ok) {
            const j = await res.json();
            if (j && j.htmlBytes === htmlBytes && Array.isArray(j.candidates)) return { from: 'dist/' + sidecar + ' (' + j.builtAt + ')', builtAt: j.builtAt, configJs: j.configJs, css: j.css, candidates: new Set(j.candidates) };
            log('(ghi chú) dist/' + sidecar + ' không khớp file (' + (j && j.htmlBytes) + ' ≠ ' + htmlBytes + ' byte) — dùng mã nguồn hiện tại.');
          }
        } catch { /* fall back */ }
        const files = await (await fetch('/__ls', { cache: 'no-store' })).json();
        const candidates = new Set();
        let css = '';
        for (const f of files) {
          if (/\.(tsx?|m?jsx?|html)$/.test(f)) extractCandidates(await (await fetch(f + '?raw', { cache: 'no-store' })).text(), candidates);
          else if (f.endsWith('.css')) css += stripTailwindDirectives(await (await fetch(f + '?raw', { cache: 'no-store' })).text()) + '\n';
        }
        const configJs = configScriptFrom(await (await fetch('/tailwind.config.js', { cache: 'no-store' })).text());

      // ---------- rule parity ----------
      function parity(refRules, builtRules) {

      // ---------- conflicting utilities on one element ----------
      // Two utilities of the SAME KIND on one element — same variant context (at-rules + selector around the class) and
      // the same set of properties (custom properties included), e.g. text-caption's colour rule + text-primary, px-4 +
      // px-5, flex + hidden, two animate-* — that set a property to different values: which one wins depends only on
      // rule order, and the dev runtime (rules generated as classes appear) and the precompiled build need not share it.
      // Kinds that combine on purpose are not counted: they set different property sets (p-4 + pt-2, inset-0 + top-2,
      // translate + scale or shadow + ring through --tw-* variables, the zero-specificity :where(.skeleton) default), and
      // neither are !important vs normal pairs (the property set records the priority).
      function splitSelectors(sel) {

          if (ch === '"' || ch === "'") { const q = ch; i++; while (i < sel.length && sel[i] !== q) i += sel[i] === '\\' ? 2 : 1; i++; continue; }
          if (ch === '[') { depthBracket++; i++; continue; }
          if (ch === ']') { depthBracket--; i++; continue; }
          if (ch !== '.' || depthBracket > 0) { i++; continue; }
          let j = i + 1;
          while (j < sel.length) {
            const c = sel[j];
            if (c === '\\') {

            for (const part of splitSelectors(r.selectorText)) {

        'overflow-y', 'padding-top', 'padding-right', 'padding-bottom', 'padding-left', 'margin-top', 'margin-right',
        'margin-bottom', 'margin-left', 'border-top-width', 'border-right-width', 'border-bottom-width', 'border-left-width',
        'border-top-style', 'border-top-color', 'border-right-color', 'border-bottom-color', 'border-left-color',
        'border-top-left-radius', 'border-bottom-right-radius', 'color', 'background-color', 'background-image', 'box-shadow',
        'outline-style', 'opacity', 'visibility', 'transform', 'font-family', 'font-size', 'font-weight', 'line-height',

      }

            for (const role of ROLES) {

              where = role + '@' + width + ' /login';

              for (let i = 0; i < routes.length; i++) {

        };

        log('');
        log('Đã đi ' + visits.length + ' lượt màn (' + unsettled.length + ' chưa yên sau 9 s), mở ' + overlaysOpened + ' overlay. Lỗi trang: ' + errors.length + '.');
        log('Lớp trong DOM: ' + domTokens.length + ' · có CSS Tailwind (tham chiếu): ' + expected.length + ' · THIẾU trong CSS nhúng: ' + misses.length);
        for (const m of misses.slice(0, 30)) log('  THIẾU ' + m.token + '  (thấy ở ' + m.first + ')');
        log('Rule tham chiếu: ' + par.referenceRules + ' · thiếu trong CSS nhúng: ' + par.missing.length + ' · đảo thứ tự: ' + par.inversions.length);
        for (const r of par.missing.slice(0, 10)) log('  thiếu rule: ' + r.slice(0, 200));
        for (const r of par.inversions.slice(0, 5)) log('  đảo thứ tự: ' + r.slice(0, 200));
        log('Lớp trong DOM không có trong danh sách ứng viên: ' + notInCandidates.length + ' (có CSS mà thiếu: ' + generatedButMissing.length + ')');
        log('Không có CSS ở đâu cả (bỏ qua, có lý do): marker ' + noCss.markers.length + ' [' + noCss.markers.join(' ') + '] · thư viện ' + noCss.library.length
          + ' · móc của app ' + noCss.hooks.length + ' [' + noCss.hooks.slice(0, 40).join(' ') + (noCss.hooks.length > 40 ? ' …' : '') + ']');
        log('Xung đột cùng loại trên một phần tử (' + lists.size + ' danh sách lớp): ' + conflicts.length);
        for (const c of conflicts.slice(0, 20)) log('  XUNG ĐỘT ' + c.pair.join(' + ') + ' · ' + c.property + ' · ' + c.context + '  (thấy ở ' + c.first + ')');
        log('Request ra host khác khi chạy: ' + (requests.length ? requests.join(', ') : 'không có'));
        log('KẾT QUẢ: ' + (result.ok ? 'ĐẠT' : 'CHƯA ĐẠT') + ' (' + Math.round(result.ms / 1000) + ' s)');
        status('Xong: ' + (result.ok ? 'ĐẠT' : 'CHƯA ĐẠT') + ' — ' + misses.length + ' lớp thiếu, ' + par.missing.length + ' rule thiếu.');
        window.__CSS_AUDIT__ = result;
      }

      const runBtn = document.getElementById('run');
      runBtn.addEventListener('click', () => {
        runBtn.disabled = true;
        audit()
          .catch((err) => {
            log('LỖI: ' + (err && err.message ? err.message : err));
            status('Lỗi: ' + (err && err.message ? err.message : err));
            window.__CSS_AUDIT__ = { ok: false, error: String(err && err.message ? err.message : err) };
          })
          .finally(() => { runBtn.disabled = false; });
      });
      if (params.has('auto')) runBtn.click();
    </script>
  </body>
</html>
